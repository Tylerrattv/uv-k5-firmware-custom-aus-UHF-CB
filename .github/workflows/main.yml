name: Firmware
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel arm-none-eabi-gcc arm-none-eabi-newlib git python python-crcmod
      - uses: actions/checkout@v4
      - name: Channel plan tests
        run: gcc -std=c11 -Wall -Wextra -Werror tests/auscb_plan_test.c -o /tmp/auscb-test && /tmp/auscb-test
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make
          arm-none-eabi-size firmware
      - uses: actions/upload-artifact@v4
        with:
          name: aus-uhf-cb-firmware
          path: firmware*.bin
          if-no-files-found: error
