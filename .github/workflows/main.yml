name: Firmware
on:
  push:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm base-devel arm-none-eabi-gcc arm-none-eabi-newlib git python python-crcmod
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate reproducible aircraft catalogue
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python tools/build_air_catalogue.py
          git diff --exit-code -- app/aircraft_data.c tests/aircraft_expected.h
      - name: Channel plan and mode tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror tests/auscb_plan_test.c -o /tmp/auscb-plan-test
          /tmp/auscb-plan-test
          gcc -std=c11 -Wall -Wextra -Werror -I. -DENABLE_VOX tests/auscb_mode_test.c app/auscb.c app/aircraft.c app/aircraft_data.c -o /tmp/auscb-mode-test
          /tmp/auscb-mode-test
          gcc -std=c11 -Wall -Wextra -Werror -I. -DENABLE_VOX -DENABLE_DTMF_CALLING tests/auscb_mode_test.c app/auscb.c app/aircraft.c app/aircraft_data.c -o /tmp/auscb-dtmf-test
          /tmp/auscb-dtmf-test
      - name: Build and verify flash image
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make AUTHOR_STRING=AUSCB
          arm-none-eabi-size firmware
          python tests/verify_firmware.py
          sha256sum firmware.packed.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aus-uhf-cb-firmware
          path: |
            firmware.packed.bin
            SHA256SUMS.txt
            AU-UHF-CB.md
            AIRCRAFT.md
            data/airports-au.csv
            data/airports-selected.txt
          if-no-files-found: error
